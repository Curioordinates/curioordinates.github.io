<html>
  <head>
    <script>
      // useVersion (settings page, Behaviour: "Use v2 map") picks the map; it defaults to v2, so this page sends visitors
      // on to the v2 map, keeping the URL parameters, unless they chose v1. The older useV2 flag means v1 only if false.
      try {
        const s = JSON.parse(localStorage.getItem("settings") || "{}");
        if ((s.useVersion ?? (s.useV2 === false ? "v1" : "v2")) === "v2") {
          window.location.replace(`./v2/index.html${window.location.search}`);
        }
      } catch (e) {}
    </script>
    <script>
      // count each page once, whatever URL parameters it was opened with
      window.goatcounter = { path: (p) => p.split("?")[0] };
    </script>
    <script
      data-goatcounter="https://untamed-earth.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Untamed Earth</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://untamed.earth" />
    <meta
      property="og:image"
      content="https://untamed.earth/images/unfurl.png"
    />
    <meta property="og:title" content="Untamed Earth Map" />
    <meta
      property="og:description"
      content="The Untamed Earth map is a point-of-reference for all things weird, spooky and outlandish - regardless of where you are on earth."
    />
    <meta
      name="description"
      content="The Untamed Earth map is a point-of-reference for all things weird, spooky and outlandish - regardless of where you are on earth."
    />
    <!-- the same MapLibre GL JS build as /v2/ -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <div id="map"></div>
    <!-- styled as MapLibre controls (maplibregl-ctrl-group) so they match the zoom buttons -->
    <div id="kofibutton" class="maplibregl-ctrl maplibregl-ctrl-group">
      <a
        class="map-btn"
        href="https://buymeacoffee.com/untamed.earth"
        target="_blank"
        title="Support the map"
        aria-label="Support the map"
        ><svg viewBox="65 60 230 230" aria-hidden="true">
          <path
            class="heart"
            d="M174.9 258.7C209.4 194 341.9 160.2 265.9 100.2 218 88.7 197.2 109.6 175.9 129.9 152.9 112.6 149.3 75.6 89 98.2 24 167.5 137.2 198.3 174.9 258.7Z"
          /></svg
      ></a>
    </div>
    <div id="settingsbutton" class="maplibregl-ctrl maplibregl-ctrl-group">
      <a class="map-btn" href="settings.html" title="Settings" aria-label="Settings"
        ><svg viewBox="39 34 280 280" aria-hidden="true">
          <path class="slider" d="M62 92H295M62 172H295M62 258H295" />
          <circle class="knob" cx="116" cy="92.5" r="35" />
          <circle class="knob" cx="234" cy="171" r="35" />
          <circle class="knob" cx="165" cy="257.5" r="35" /></svg
      ></a>
    </div>
    <script src="v2/maplibre-gl.js"></script>
    <script src="timezone-location.js"></script>
    <script src="v2/pins.js"></script>
    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js", { scope: "./" });
      }
    </script>
  </body>
</html>
