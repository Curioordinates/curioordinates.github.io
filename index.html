<html>
  <head>
    <script>
      // useVersion (settings page, Behaviour: "Use v2 map") picks the map; it defaults to v2, so this page sends visitors
      // on to the v2 map, keeping the URL parameters, unless they chose v1. The older useV2 flag means v1 only if false.
      try {
        const s = JSON.parse(localStorage.getItem("settings") || "{}");
        if ((s.useVersion ?? (s.useV2 === false ? "v1" : "v2")) === "v2") {
          window.location.replace(`./v2/index.html${window.location.search}`);
        }
      } catch (e) {}
    </script>
    <script
      data-goatcounter="https://untamed-earth.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://untamed.earth" />
    <meta
      property="og:image"
      content="https://untamed.earth/images/unfurl.png"
    />
    <meta property="og:title" content="Untamed Earth Map" />
    <meta
      property="og:description"
      content="The Untamed Earth map is a point-of-reference for all things weird, spooky and outlandish - regardless of where you are on earth."
    />
    <meta
      name="description"
      content="The Untamed Earth map is a point-of-reference for all things weird, spooky and outlandish - regardless of where you are on earth."
    />
    <!-- the same MapLibre GL JS build as /v2/ -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="kofibutton">
      <a href="https://buymeacoffee.com/untamed.earth" target="_blank">
        <img
          src="images/support.png"
          width="30px"
          height="30px"
          title="Support the map"
      /></a>
    </div>
    <div id="settingsbutton">
      <a href="settings.html">
        <img
          src="images/settings.png"
          width="40px"
          height="40px"
          title="Settings"
      /></a>
    </div>
    <script src="v2/maplibre-gl.js"></script>
    <script src="timezone-location.js"></script>
    <script src="v2/pins.js"></script>
    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js", { scope: "./" });
      }
    </script>
  </body>
</html>
