<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #222;
        background: #f4f4f4;
      }
      h1 {
        font-size: 1.2em;
        margin: 0;
        padding: 0.5em 0.75em;
        background: white;
        border-bottom: 1px solid #ddd;
      }
      #tags-div {
        flex: 1;
        overflow-y: auto;
        padding: 0.5em 0.75em;
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.6em 0.75em;
        margin-bottom: 0.5em;
        background: white;
        border-radius: 0.3em;
        cursor: pointer;
      }
      .tag:hover {
        background: #eef6ff;
      }
      .opt {
        width: 1em;
        height: 1em;
        margin: 0;
        flex-shrink: 0;
        accent-color: #2e8b57;
      }
      .icon {
        width: 2em;
        height: 2em;
        object-fit: contain;
        flex-shrink: 0;
      }
      .controls {
        display: flex;
        justify-content: space-between;
        gap: 0.5em;
        padding: 0.5em 0.75em;
        background: white;
        border-top: 1px solid #ddd;
      }
      button {
        font: inherit;
        padding: 0.3em 1em;
        border: 1px solid #aaa;
        border-radius: 0.3em;
        background: #f8f8f8;
        cursor: pointer;
      }
      .default {
        background: #2e8b57;
        border-color: #2e8b57;
        color: white;
      }
    </style>
    <script src="settings.js"></script>
  </head>
  <body onload="setup()">
    <h1>Show on map</h1>
    <div id="tags-div"></div>
    <div class="controls">
      <button id="cancel">Cancel</button>
      <button id="apply" class="default">Apply</button>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js", { scope: "./" });
      }
    </script>
  </body>
</html>
